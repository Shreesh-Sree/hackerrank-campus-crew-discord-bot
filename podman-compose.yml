version: "3.8"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: hrcc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrcc_user
      POSTGRES_PASSWORD: CampusCrewPostgres2026!
      POSTGRES_DB: hrcc_bot
    volumes:
      - hrcc_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrcc_user -d hrcc_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Containerfile
    container_name: hrcc-bot
    restart: unless-stopped
    env_file:
      - .env.container
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - hrcc_data:/app/data
      - ./references:/app/references:ro
      - ./knowledge_data.yaml:/app/knowledge_data.yaml:ro
    network_mode: host

volumes:
  hrcc_pgdata:
  hrcc_data:
